services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  flask-rag:
    build: ./flask_rag
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/insurance_rag
    depends_on:
      db:
        condition: service_healthy

  django:
    build: ./django_app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      RAG_SERVICE_URL: http://flask-rag:5001
    depends_on:
      db:
        condition: service_healthy
      flask-rag:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - django

volumes:
  pgdata:
